<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.title %}
  <title>{{ page.title }} · {{ site.title }}</title>
  {%- else %}
  <title>{{ site.title }} · Applied lattice-based cryptography · Yale</title>
  {%- endif %}
  <meta name="description" content="{{ site.description | strip }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="google-site-verification" content="8GgZd6bogDy2eEowpdjCCAQnhwWvoxNOvKclw7LQiZU">
  <link rel="canonical" href="{{ site.url }}{{ page.url | remove: 'index.html' }}">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description | strip }}">
  <meta property="og:url" content="{{ site.url }}/">
  <meta property="og:image" content="{{ site.url }}/images/og.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">

  <script>
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "url": "{{ site.url }}/",
    "image": "{{ site.url }}/images/yunhao.jpg",
    "jobTitle": "Ph.D. student in Computer Science",
    "affiliation": { "@type": "CollegeOrUniversity", "name": "Yale University" },
    "alumniOf": [
      { "@type": "CollegeOrUniversity", "name": "Columbia University" },
      { "@type": "CollegeOrUniversity", "name": "University of California, Los Angeles" }
    ],
    "knowsAbout": ["Lattice-based cryptography", "Fully homomorphic encryption", "Oblivious message retrieval", "Single secret leader election", "Verifiable computation", "SNARKs"],
    "sameAs": ["{{ site.author.scholar }}", "{{ site.author.github }}"]
  }
  </script>
</head>
<body>
{{ content }}
<script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
